name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode persistent signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "GRESKA: Secret SIGNING_KEY nije postavljen u GitHub Secrets!"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/mediastudio-key.jks"
          echo "$SIGNING_KEY" | tr -d '\r\n ' | base64 -d > "$KEY_FILE"
          keytool -list -keystore "$KEY_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "KEYSTORE_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Prepare APK artifact
        run: |
          BUILT_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$BUILT_APK" MediaStudio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-APK
          path: MediaStudio.apk
